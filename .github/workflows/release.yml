name: Build on Release

on:
  release:
    types: [created]

jobs:
  build:
    strategy:
      matrix:
        build:
          - name: 'Linux'
            os: ubuntu-latest
            platform: 'linux/amd64'
          - name: 'Windows'
            os: windows-latest
            platform: 'windows/amd64'
          - name: 'macOS'
            os: macos-latest
            platform: 'darwin/universal'
            
    runs-on: ${{ matrix.build.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21' # Adjust version as needed

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Adjust version as needed

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev build-essential pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build App
        run: wails build -platform ${{ matrix.build.platform }}

      - name: Upload artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/bin/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
