name: Build on Release

on:
  release:
    types: [created]

jobs:
  build:
    permissions:
      contents: write
    strategy:
      matrix:
        build:
          - name: 'Linux'
            os: ubuntu-latest
            platform: 'linux/amd64'
          - name: 'Windows'
            os: windows-latest
            platform: 'windows/amd64'
          - name: 'macOS'
            os: macos-latest
            platform: 'darwin/universal'
            
    runs-on: ${{ matrix.build.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.21' # Adjust version as needed

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24' # Adjust version as needed

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build App (Linux)
        if: runner.os == 'Linux'
        run: wails build -platform ${{ matrix.build.platform }} -tags webkit2_41

      - name: Build App (Mac/Windows)
        if: runner.os != 'Linux'
        run: wails build -platform ${{ matrix.build.platform }}

      - name: Archive artifacts (Linux)
        if: runner.os == 'Linux'
        run: cd build/bin && tar -czvf keepsake-linux-amd64.tar.gz keepsake

      - name: Archive artifacts (macOS)
        if: runner.os == 'macOS'
        run: cd build/bin && zip -r keepsake-macos-universal.zip keepsake.app

      - name: Archive artifacts (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path build\bin\keepsake.exe -DestinationPath build\bin\keepsake-windows-amd64.zip

      - name: Upload artifacts
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/bin/*.zip
            build/bin/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
